<svg width="1180" height="320" viewBox="0 0 1180 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MappedFiction logo</title>
  <desc id="desc">A literary atlas logo combining an open book, a globe, and a chapter route path.</desc>

  <defs>
    <linearGradient id="globeFill" x1="70" y1="40" x2="235" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FD7EA"/>
      <stop offset="0.48" stop-color="#4EA2D1"/>
      <stop offset="1" stop-color="#255B9A"/>
    </linearGradient>

    <linearGradient id="pageFill" x1="56" y1="182" x2="240" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6DF"/>
      <stop offset="1" stop-color="#E9C879"/>
    </linearGradient>

    <linearGradient id="routeStroke" x1="93" y1="174" x2="224" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D76C42"/>
      <stop offset="0.58" stop-color="#D8A23B"/>
      <stop offset="1" stop-color="#F3C85B"/>
    </linearGradient>

    <radialGradient id="globeHighlight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(104 74) rotate(50) scale(115 95)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.68"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="globeClip">
      <circle cx="150" cy="124" r="83"/>
    </clipPath>

    <filter id="softShadow" x="20" y="20" width="270" height="260" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#102033" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Open book / atlas pages -->
    <path d="M50 195C84 175 119 178 150 204V259C118 232 84 224 50 241V195Z" fill="url(#pageFill)" stroke="#102033" stroke-width="6" stroke-linejoin="round"/>
    <path d="M250 195C216 175 181 178 150 204V259C182 232 216 224 250 241V195Z" fill="url(#pageFill)" stroke="#102033" stroke-width="6" stroke-linejoin="round"/>
    <path d="M150 205V259" stroke="#102033" stroke-width="6" stroke-linecap="round"/>
    <path d="M74 211C98 203 119 207 138 221" stroke="#9B7628" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
    <path d="M226 211C202 203 181 207 162 221" stroke="#9B7628" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>

    <!-- Globe -->
    <circle cx="150" cy="124" r="83" fill="url(#globeFill)" stroke="#102033" stroke-width="7"/>
    <circle cx="150" cy="124" r="83" fill="url(#globeHighlight)"/>

    <g clip-path="url(#globeClip)" opacity="0.96">
      <ellipse cx="150" cy="124" rx="80" ry="28" stroke="#E8F7FB" stroke-opacity="0.72" stroke-width="3"/>
      <ellipse cx="150" cy="124" rx="80" ry="58" stroke="#E8F7FB" stroke-opacity="0.42" stroke-width="3"/>
      <ellipse cx="150" cy="124" rx="31" ry="83" stroke="#E8F7FB" stroke-opacity="0.58" stroke-width="3"/>
      <ellipse cx="150" cy="124" rx="61" ry="83" stroke="#E8F7FB" stroke-opacity="0.36" stroke-width="3"/>
      <path d="M67 124H233" stroke="#E8F7FB" stroke-opacity="0.45" stroke-width="3"/>
      <path d="M150 41V207" stroke="#E8F7FB" stroke-opacity="0.34" stroke-width="3"/>

      <!-- Abstract landforms -->
      <path d="M82 111C99 92 121 92 135 106C143 114 155 111 164 102C176 90 196 92 211 108C199 109 191 116 185 128C178 142 162 148 148 140C136 133 126 137 114 149C102 160 85 153 82 137C80 127 75 119 82 111Z" fill="#2B7B5D" fill-opacity="0.38"/>
      <path d="M101 63C115 55 133 59 141 72C149 84 142 96 126 96C112 96 98 89 94 78C92 71 94 67 101 63Z" fill="#2B7B5D" fill-opacity="0.26"/>
      <path d="M174 158C188 147 207 147 217 161C227 174 216 194 198 197C183 199 170 187 169 174C168 167 169 162 174 158Z" fill="#2B7B5D" fill-opacity="0.3"/>
    </g>

    <!-- Story route with chapter points -->
    <path d="M88 171C105 142 121 151 132 130C143 109 159 103 176 115C195 128 198 94 223 91" stroke="url(#routeStroke)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M88 171C105 142 121 151 132 130C143 109 159 103 176 115C195 128 198 94 223 91" stroke="#FFF6DF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

    <circle cx="88" cy="171" r="10" fill="#FFF6DF" stroke="#102033" stroke-width="5"/>
    <circle cx="132" cy="130" r="9" fill="#FFF6DF" stroke="#102033" stroke-width="5"/>
    <circle cx="176" cy="115" r="9" fill="#FFF6DF" stroke="#102033" stroke-width="5"/>

    <!-- Final map pin -->
    <path d="M223 73C209 73 198 84 198 98C198 116 223 142 223 142C223 142 248 116 248 98C248 84 237 73 223 73Z" fill="#D76C42" stroke="#102033" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="223" cy="98" r="8" fill="#FFF6DF"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(326 0)">
    <text x="0" y="154" font-family="Avenir Next, Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-3.5" fill="#102033">Mapped</text>
    <text x="292" y="154" font-family="Avenir Next, Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-3.5" fill="#2A6FBB">Fiction</text>
    <path d="M5 178H548" stroke="#102033" stroke-width="6" stroke-linecap="round" opacity="0.1"/>
    <text x="2" y="218" font-family="Avenir Next, Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="2.8" fill="#667180">CHAPTER-BY-CHAPTER LITERARY ATLAS</text>
  </g>
</svg>
